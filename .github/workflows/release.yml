name: Release plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        id: metadata
        env:
          RELEASE_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from submit_database import channel, release_url, validate_registration_manifest
          manifest = json.loads(pathlib.Path('manifest.json').read_text())
          validate_registration_manifest(manifest)
          tag = 'v' + manifest['version']
          if os.environ['RELEASE_REF'] != 'refs/tags/' + tag:
              raise SystemExit('Run this workflow on the tag matching manifest.version: ' + tag)
          release_url(manifest, os.environ['REPOSITORY'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
              output.write('prerelease=' + str(channel(manifest['version']) == 'testing').lower() + '\n')
          pathlib.Path('release-notes.md').write_text(manifest['changelog'] + '\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install dependencies
        run: npm ci
      - name: Check and test
        run: |
          npm run typecheck
          npm test
          npm run test:i18n
          npm run test:focus
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and package
        run: |
          npm run build
          python3 scripts/pack.py
          python3 - <<'PY'
          import pathlib, struct
          backend = pathlib.Path('payload/backend').read_bytes()
          assert backend[:4] == b'\x7fELF' and backend[4:6] == bytes([2, 1])
          assert struct.unpack_from('<H', backend, 18)[0] == 183, 'Backend must be ARM64'
          PY
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.framely
            dist/SHA256SUMS
            release-notes.md
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.framely dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md "${args[@]}"

  submit-database:
    needs: [build, release]
    uses: ./.github/workflows/submit-database.yml
    with:
      release_tag: ${{ needs.build.outputs.tag }}
    secrets:
      DATABASE_TOKEN: ${{ secrets.DATABASE_TOKEN }}
