name: Check and package plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: npm ci
      - name: Check and test
        run: |
          npm run typecheck
          npm test
          npm run test:i18n
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build ARM64 package
        run: |
          npm run build
          python3 scripts/pack.py
          python3 - <<'PY'
          import pathlib, struct
          backend = pathlib.Path('payload/backend').read_bytes()
          assert backend[:4] == b'\x7fELF' and backend[4:6] == bytes([2, 1])
          assert struct.unpack_from('<H', backend, 18)[0] == 183, 'Backend must be ARM64'
          PY
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: volume-mixer-arm64
          path: |
            dist/*.framely
            dist/SHA256SUMS
          if-no-files-found: error
